    function calculateStrictImpact(text, sourceName = '') {
      const low = (text + ' ' + sourceName).toLowerCase();
      const tier1Shock = /\b(fomc|rate hike|rate cut|interest rate decision|monetary policy decision|emergency|strait of hormuz|war-risk|military strike|missile|sanctions|cpi|core cpi|pce|nonfarm|nfp|payroll|gdp|recession|default|bailout|intervention)\b/.test(low);
      if (tier1Shock) return 9;

      const tier2Institutional = /\b(federal reserve|fed |powell|waller|bowman|ecb|lagarde|de cos|bank of england|boe|bailey|bank of japan|boj|ueda|rba|bullock|snb|schlegel|bank of canada|boc|macklem|rbnz|inflation|unemployment|pmi|retail sales|tariff|tariffs|opec|oat|bund|treasury yield|ing think|ing fx|trading economics)\b/.test(low);
      if (tier2Institutional) return 8;

      return 6;
    }

    function formatRealTimeAgo(isoString) {
      const ts = new Date(isoString).getTime();
      if (isNaN(ts)) return 'Live';
      const diffSec = Math.max(60, Math.floor((Date.now() - ts) / 1000));
      if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m ago`;
      if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}h ago`;
      return `${Math.floor(diffSec / 86400)}d ago`;
    }

    function getDaysOld(isoString) {
      const ts = new Date(isoString).getTime();
      if (isNaN(ts)) return 0;
      return Math.max(0, (Date.now() - ts) / (1000 * 3600 * 24));
    }

    function getTopicFingerprint(title) {
      const stop = new Set(['the', 'and', 'for', 'with', 'amid', 'after', 'over', 'into', 'from', 'says', 'as', 'in', 'on', 'to', 'of', 'a', 'an', 'new', 'report', 'wire', 'live']);
      return title
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, ' ')
        .split(/\s+/)
        .filter(w => w.length > 2 && !stop.has(w))
        .slice(0, 5)
        .sort()
        .join('|');
    }

    function classifyStoryMeta(text) {
      const low = text.toLowerCase();
      const isBank = /\b(ing|think\.ing|goldman|jpmorgan|citi|ubs|morgan stanley|research note|positioning|cftc)\b/.test(low);
      const isGeo = /\b(war|hormuz|oil|crude|opec|tariff|sanction|election|budget|france|china|middle east|missile|oat|bund)\b/.test(low);

      if (isBank) {
        return {
          topic: 'BANKS',
          topicLabel: '🏦 ING & Bank Research',
          horizon: 'LONG',
          horizonLabel: 'Long-Term (15–45d+)'
        };
      }
      if (isGeo) {
        return {
          topic: 'GEOPOLITICS',
          topicLabel: '🌍 Geopolitics & Oil',
          horizon: /\b(tariff|budget|france|election|sanction)\b/.test(low) ? 'MEDIUM' : 'SHORT',
          horizonLabel: /\b(tariff|budget|france|election|sanction)\b/.test(low) ? 'Medium-Term (7–14d)' : 'Short-Term (1–3d)'
        };
      }
      return {
        topic: 'MONETARY',
        topicLabel: '🏛️ Central Banks & Governors',
        horizon: /\b(2027|cycle|structural|cuts|future)\b/.test(low) ? 'LONG' : 'MEDIUM',
        horizonLabel: /\b(2027|cycle|structural|cuts|future)\b/.test(low) ? 'Long-Term (15–45d+)' : 'Medium-Term (7–14d)'
      };
    }

    function detectImpactsFromText(text) {
      const low = text.toLowerCase();
      const bearish = /\b(cut|dovish|drop|fall|slump|plunge|crisis|deadlock|weak|slow|tariff|tariffs|war|hormuz|risk-off)\b/.test(low);
      const list = [];
      const map = [
        ['USD', /\b(fed|fomc|powell|waller|bowman|dollar|usd|treasury|us |u\.s\.)\b/],
        ['EUR', /\b(ecb|lagarde|de cos|euro|eur|france|germany|oat|bund)\b/],
        ['GBP', /\b(boe|bank of england|bailey|gbp|sterling|pound|uk )\b/],
        ['JPY', /\b(boj|bank of japan|ueda|jpy|yen|japan)\b/],
        ['CHF', /\b(snb|swiss|franc|chf|schlegel)\b/],
        ['AUD', /\b(rba|australia|aussie|aud|bullock|china)\b/],
        ['NZD', /\b(rbnz|new zealand|kiwi|nzd)\b/],
        ['CAD', /\b(boc|bank of canada|canada|loonie|cad|oil|crude|opec|macklem)\b/]
      ];
      map.forEach(([code, regex]) => {
        if (regex.test(low)) {
          let dir = 'BULLISH';
          if (code === 'AUD' || code === 'NZD') {
            dir = /\b(hike|hawkish|surge|rally|stimulus|beat)\b/.test(low) && !bearish ? 'BULLISH' : 'BEARISH';
          } else if (code === 'EUR') {
            dir = /\b(hike|hawkish|beat|rebound)\b/.test(low) && !bearish ? 'BULLISH' : 'BEARISH';
          } else if (bearish && code !== 'USD' && code !== 'CHF' && code !== 'JPY') {
            dir = 'BEARISH';
          }
          list.push({ code, dir });
        }
      });
      if (list.length === 0) list.push({ code: 'USD', dir: 'BULLISH' });
      return list;
    }

    function buildCleanSummary(title, rawDesc, sourceName, imps) {

      if (cleaned.length > 45) {
        return cleaned.slice(0, 1400);
      }
      return `Wire headline via ${sourceName}: "${title}" (Impacts: ${assetNames} — click "Read Original Source" below to view full article details).`;
    }

    function addStoryDeduplicated(newStory) {
      if (!hasLoadedLiveFeed) {
        NEWS_FEED = NEWS_FEED.filter(n => !n.isBaseline);
        hasLoadedLiveFeed = true;
      }

      const fp = getTopicFingerprint(newStory.title);
      const existing = NEWS_FEED.find(n =>
        n.title.toLowerCase() === newStory.title.toLowerCase() ||
        (fp.length >= 12 && getTopicFingerprint(n.title) === fp)
      );

      if (existing) {
        (newStory.sources || []).forEach(src => {
          if (src && !existing.sources.includes(src)) {
            existing.sources.push(src);
          }
        });
        if (new Date(newStory.publishedAt) > new Date(existing.publishedAt)) {
          existing.publishedAt = newStory.publishedAt;
        }
        return false;
      }

      NEWS_FEED.unshift(newStory);
      return true;
    }

              }).join('')}
            </div>

            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs transition">
              Read Original Source ↗
            </a>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
      document.getElementById('close-modal').addEventListener('click', () => modal.classList.add('hidden'));
    }

    async function syncLiveNews() {
      const label = document.getElementById('sync-label');
      label.textContent = 'Syncing Live...';

      // 1. Load feed.json generated by GitHub Actions bot if available
      try {
        const res = await fetch(`./feed.json?t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.stories)) {
            data.stories.forEach((st, idx) => {
              if (!st.title) return;
              const imps = (st.currencyImpacts || [{ code: 'USD', dir: 'BULLISH' }]).filter(x => x.code !== 'XAU');
              const meta = classifyStoryMeta(st.title + ' ' + (st.sources || []).join(' '));
              const strictImp = calculateStrictImpact(st.title + ' ' + (st.summaryEn || ''), (st.sources || []).join(' '));
              const srcList = Array.isArray(st.sources) && st.sources.length ? st.sources : ['Bloomberg / Reuters'];
              const richSummary = buildCleanSummary(st.title, st.summaryEn || '', srcList.join(' + '), imps);
              addStoryDeduplicated({
                id: `feed-${idx}-${st.publishedAt || Date.now()}`,
                publishedAt: st.publishedAt || new Date().toISOString(),
                impact: strictImp,
                topic: st.category || meta.topic,
                topicLabel: st.category === 'BANKS' ? '🏦 ING & Bank Research' : st.category === 'GEOPOLITICS' ? '🌍 Geopolitics & Oil' : meta.topicLabel,
                horizon: st.horizon || meta.horizon,
                horizonLabel: st.horizon === 'LONG' ? 'Long-Term (15–45d+)' : st.horizon === 'SHORT' ? 'Short-Term (1–3d)' : meta.horizonLabel,
                sources: srcList,
                title: st.title,
                summary: richSummary,
                cause: `Direct G8 central bank, sovereign yield, and macro catalyst triggered by: ${st.title}.`,
                impacts: imps.length ? imps : [{ code: 'USD', dir: 'BULLISH' }],
                url: st.url || 'https://think.ing.com/'
              });
            });
          }
        }
      } catch (e) {}

      // 2. Live Direct Browser RSS Wire (Trading Economics, FXStreet, Google News Live 24h, CNBC, Yahoo Finance, ING Think)
      const LIVE_BROWSER_RSS = [
        { name: 'Trading Economics Wire', url: 'https://tradingeconomics.com/rss/news.aspx' },
        { name: 'FXStreet Live Wire', url: 'https://www.fxstreet.com/rss/news' },
        { name: 'Google News FX & Central Banks', url: 'https://news.google.com/rss/search?q=(%22Federal+Reserve%22+OR+%22ECB%22+OR+%22Bank+of+England%22+OR+%22Bank+of+Japan%22+OR+%22RBA%22+OR+%22forex%22)+when:1d&hl=en-US&gl=US&ceid=US:en' },
        { name: 'Google News Geopolitics & Oil', url: 'https://news.google.com/rss/search?q=(%22crude+oil%22+OR+%22Strait+of+Hormuz%22+OR+%22tariffs%22+OR+%22interest+rate%22+OR+%22inflation%22)+when:1d&hl=en-US&gl=US&ceid=US:en' },
        { name: 'ING Think FX & Macro', url: 'https://think.ing.com/rss/' },
        { name: 'CNBC Economy & Markets', url: 'https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258' },
        { name: 'Yahoo Finance Macro', url: 'https://finance.yahoo.com/news/rssindex' }
      ];

      await Promise.allSettled(LIVE_BROWSER_RSS.map(async (feed, fIdx) => {
        try {
          const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}&_t=${Date.now()}`;
          const rRes = await fetch(apiUrl);
          if (!rRes.ok) return;
          const rData = await rRes.json();
          if (rData.status !== 'ok' || !Array.isArray(rData.items)) return;

          rData.items.slice(0, 12).forEach((item, idx) => {
            const title = (item.title || '').trim();
            if (!title || title.length < 18) return;
            const rawDesc = (item.description || item.content || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
            const fullText = `${title} ${rawDesc}`;
            if (!/\b(fed|fomc|powell|waller|bowman|ecb|lagarde|de cos|boe|bailey|boj|ueda|rba|snb|boc|macklem|rate|inflation|cpi|pce|gdp|pmi|jobs|nfp|dollar|usd|euro|eur|sterling|gbp|yen|jpy|franc|chf|aussie|aud|kiwi|nzd|loonie|cad|forex|oil|crude|opec|hormuz|tariff|sanction|treasury|yield|ing)\b/i.test(fullText)) return;

            let pubDate = item.pubDate ? new Date(item.pubDate.replace(' ', 'T') + (item.pubDate.includes('Z') || item.pubDate.includes('+') ? '' : 'Z')) : new Date();
            if (isNaN(pubDate.getTime())) pubDate = new Date();
            const now = new Date();
            if (pubDate.getUTCHours() === 0 && pubDate.getUTCMinutes() === 0 && pubDate.toISOString().slice(0, 10) === now.toISOString().slice(0, 10)) {
              pubDate = now;
            }

            const imps = detectImpactsFromText(fullText);
            const meta = classifyStoryMeta(fullText + ' ' + feed.name);
            const cleanSummary = buildCleanSummary(title, rawDesc, feed.name, imps);

            addStoryDeduplicated({
              id: `rss-${fIdx}-${idx}-${pubDate.getTime()}`,
              publishedAt: pubDate.toISOString(),
              impact: calculateStrictImpact(fullText, feed.name),
              topic: meta.topic,
              topicLabel: meta.topicLabel,
              horizon: meta.horizon,
              horizonLabel: meta.horizonLabel,
              sources: [item.author && item.author.length < 35 ? `${feed.name} (${item.author})` : feed.name],
              title,
              summary: cleanSummary,
              cause: `Direct G8 central bank policy, rate-differential & macro sentiment shift driven by: ${title}.`,
              impacts: imps,
              url: item.link || 'https://www.fxstreet.com/news'
            });
          });
        } catch (e) {}
      }));

      // 3. Live GDELT Wire Backup
      try {
        const q = encodeURIComponent('(Fed OR ECB OR BoE OR BoJ OR RBA OR forex OR oil OR tariffs) sourcelang:english');
        const gRes = await fetch(`https://api.gdeltproject.org/api/v2/doc/doc?query=${q}&mode=ArtList&maxrecords=25&timespan=24h&format=json&sort=DateDesc`);
        if (gRes.ok) {
          const gData = await gRes.json();
          (gData.articles || []).forEach((art, idx) => {
            const title = (art.title || '').trim();
            if (!title || title.length < 20 || !art.seendate || art.seendate.length < 15) return;
            const s = art.seendate;
            const pubIso = `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T${s.slice(9,11)}:${s.slice(11,13)}:${s.slice(13,15)}Z`;
            if (isNaN(new Date(pubIso).getTime())) return;

            const imps = detectImpactsFromText(title);
            const meta = classifyStoryMeta(title + ' ' + (art.domain || ''));
            const richSummary = buildCleanSummary(title, '', art.domain || 'Global News Wire', imps);
            addStoryDeduplicated({
              id: `gdelt-${s}-${idx}`,
              publishedAt: pubIso,
              impact: calculateStrictImpact(title, art.domain || ''),
              topic: meta.topic,
              topicLabel: meta.topicLabel,
              horizon: meta.horizon,
              horizonLabel: meta.horizonLabel,
              sources: [art.domain || 'Global News Wire'],
              title,
              summary: richSummary,
              cause: `Immediate repricing across G8 FX markets, sovereign yields, and policy expectations driven by: ${title}.`,
              impacts: imps,
              url: art.url || 'https://www.reuters.com/'
            });
          });
        }
      } catch (e) {}

      const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      label.textContent = `Synced ${nowStr}`;
      renderAll();
    }

    function renderAll() {
      renderFilters();
      renderCurrencyReasonBox();
      renderNews();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderAll();
      syncLiveNews();
      setInterval(syncLiveNews, 5 * 60 * 1000);
      setInterval(renderNews, 60 * 1000);

      document.querySelectorAll('.topic-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTopic = btn.getAttribute('data-topic');
          renderAll();
        });
      });

      document.querySelectorAll('.hor-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeHorizon = btn.getAttribute('data-hor');
          renderAll();
        });
      });

      document.querySelectorAll('.day-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeDays = Number(btn.getAttribute('data-days'));
          renderAll();
        });
      });

      document.querySelectorAll('.imp-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeImpact = btn.getAttribute('data-imp');
          renderAll();
        });
      });

      document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderNews();
      });

      document.getElementById('btn-refresh').addEventListener('click', syncLiveNews);

      document.getElementById('detail-modal').addEventListener('click', (e) => {
        if (e.target.id === 'detail-modal') e.target.classList.add('hidden');
      });

      document.getElementById('btn-download').addEventListener('click', () => {
        const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'index.html';
        a.click();
        URL.revokeObjectURL(a.href);
      });
    });
  </script>
</body>
</html>
